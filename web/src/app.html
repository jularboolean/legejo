<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Installable as an app: the manifest, and what iOS reads instead of it. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Legejo" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<!-- What is seen while the app starts: its own background and, if
		     starting takes more than a moment, the pigeons. Without this an
		     app opened from the home screen is a blank screen until its code
		     has loaded and asked who is logged in. Taken away by the root
		     layout once there is a page to show. -->
		<style>
			html {
				background: #f3f5f5;
			}
			#starting {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				pointer-events: none;
				opacity: 0;
				animation: starting 0.3s ease-out 0.25s forwards;
			}
			#starting img {
				width: min(38vw, 9rem);
				height: auto;
			}
			@keyframes starting {
				to {
					opacity: 1;
				}
			}
			@media (prefers-color-scheme: dark) {
				html:not([data-design]) {
					background: #15181a;
				}
			}
			html[data-design='dark'] {
				background: #15181a;
			}
			html[data-design='zamenhof'] {
				background: #e8dabd;
			}
			@media (prefers-reduced-motion: reduce) {
				#starting {
					animation-duration: 0.01s;
				}
			}
		</style>
		<script>
			// The chosen design, before anything is painted (see design.svelte.ts).
			try {
				var d = localStorage.getItem('legejo.design');
				if (d === 'light' || d === 'dark' || d === 'zamenhof') document.documentElement.dataset.design = d;
				if (localStorage.getItem('legejo.motion') === 'off') document.documentElement.dataset.motion = 'off';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="starting" aria-hidden="true"><img src="/pigeons.svg" alt="" width="322" height="342" /></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
