[package]
name = "legejo"
version = "1.4.0"
edition = "2021"
description = "A self-hosted EPUB library with OPDS, Kobo sync and KOReader sync"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jularboolean/legejo"
publish = false
default-run = "legejo"

[[bin]]
name = "legejo"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
epub = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
axum-extra = { version = "0.10", features = ["cookie"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "time", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
time = { version = "0.3", features = ["serde", "macros", "formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
rsa = { version = "0.9", features = ["sha2", "pem"] }
httpdate = "1"
url = "2"
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# RSA key generation and signing are painfully slow unoptimized; tests and
# `cargo run` generate keys for federated shelves.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
